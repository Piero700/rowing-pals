# One site holds the website (marketing/website, copied to dist) and the rower page (dist/go).
# WEB_MODE picks the Vite mode: unset builds staging; the production site sets WEB_MODE=production.
[build]
  publish = "dist"
  command = "npm run build:site"
  # Skip a build only when neither web/ nor the website pages changed. Without this, Netlify watches only the base
  # directory (web/), so changes to marketing/website would never go live.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../marketing/website"

[[redirects]]
  from = "/go/*"
  to = "/go/index.html"
  status = 200
