<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><title>Rowing Pals — Editable screens</title><style>html,body{margin:0;background:#16171b}a{color:#91b8ff}a:hover{color:#c6adff}</style></helmet>
<div style="width:max-content;min-width:100%;min-height:100vh;box-sizing:border-box;background:#16171b;padding:64px;font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;color:#f7f8fc;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#bbc0ce;font-weight:700">Rowing Pals · editable build</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-.03em">All screens — dark &amp; light</div>
    <div style="font-size:15px;color:#bbc0ce;max-width:760px;line-height:1.5">Each screen lives once in RP Screen and is themed by the tokens on its frame, so an edit updates both modes.</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,max-content);gap:72px">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="12">
      <div id="{{ s.id }}" style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="font-size:14px;font-weight:800;color:#91b8ff;font-variant-numeric:tabular-nums">{{ s.num }}</span>
          <span style="font-size:22px;font-weight:750;letter-spacing:-.02em">{{ s.name }}</span>
        </div>
        <div style="display:flex;gap:28px">
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:12px;color:#bbc0ce;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Dark</span>
            <div style="width:393px;height:852px;border-radius:48px;overflow:hidden;border:1px solid #464a56;box-shadow:0 28px 70px rgba(0,0,0,.45);--bg:#09090b;--base:#101114;--card:#1b1c21;--raised:#292c34;--line:#464a56;--cardEdge:rgba(70,74,86,.7);--text:#f7f8fc;--muted:#bbc0ce;--faint:#a3abba;--brand:#91b8ff;--brandSoft:rgba(145,184,255,.14);--onBrand:#09090b;--good:#78d7ac;--accent:#c6adff;--accentSoft:rgba(198,173,255,.12);--gold:#efc37c;--goldSoft:rgba(239,195,124,.12);--bad:#ff766f;--lg-fill:rgba(58,62,74,.42);--lg-fill-strong:rgba(92,98,114,.55);--lg-edge:rgba(255,255,255,.16);--lg-hi:rgba(255,255,255,.28);--lg-lo:rgba(0,0,0,.22);--lg-shadow:0 8px 24px rgba(0,0,0,.22)">
              <dc-import name="RP Screen" screen="{{ s.key }}" hint-size="393px,852px"></dc-import>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:12px;color:#bbc0ce;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Light</span>
            <div style="width:393px;height:852px;border-radius:48px;overflow:hidden;border:1px solid #949eae;box-shadow:0 28px 70px rgba(0,0,0,.45);--bg:#dfe3eb;--base:#edf0f5;--card:#ffffff;--raised:#dce2ec;--line:#949eae;--cardEdge:#a8b1bf;--text:#111723;--muted:#3e4c61;--faint:#4e5c70;--brand:#214fa3;--brandSoft:rgba(33,79,163,.12);--onBrand:#ffffff;--good:#176a4a;--accent:#67409b;--accentSoft:rgba(103,64,155,.10);--gold:#84500b;--goldSoft:rgba(132,80,11,.10);--bad:#c93c36;--lg-fill:rgba(255,255,255,.52);--lg-fill-strong:rgba(255,255,255,.92);--lg-edge:rgba(40,55,85,.16);--lg-hi:rgba(255,255,255,.95);--lg-lo:rgba(30,45,75,.08);--lg-shadow:0 6px 20px rgba(25,40,70,.12)">
              <dc-import name="RP Screen" screen="{{ s.key }}" hint-size="393px,852px"></dc-import>
            </div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const list = [['onboarding','Onboarding'],['feed','Activity feed'],['rankings','Rankings'],['capture','Log workout'],['review','Review session'],['profile','Profile'],['settings','Settings'],['person','Other profile'],['people','Find rowers'],['pb-history','PB history'],['all-pbs','All personal bests'],['clubs','Clubs']];
    return { screens: list.map(([key, name], i) => { const num = String(i + 1).padStart(2, '0'); return { key, name, num, id: 's' + num }; }) };
  }
}
</script>
</body>
</html>
