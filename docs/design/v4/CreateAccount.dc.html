<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#91b8ff}a:hover{color:#c6adff}
</style>
</helmet>
<div data-screen-label="Create your account" style="--bg:{{ t.bg }};--base:{{ t.base }};--card:{{ t.card }};--raised:{{ t.raised }};--line:{{ t.line }};--cardEdge:{{ t.cardEdge }};--text:{{ t.text }};--muted:{{ t.muted }};--faint:{{ t.faint }};--brand:{{ t.brand }};--brandSoft:{{ t.brandSoft }};--onBrand:{{ t.onBrand }};--good:{{ t.good }};--accent:{{ t.accent }};--accentSoft:{{ t.accentSoft }};--gold:{{ t.gold }};--goldSoft:{{ t.goldSoft }};--bad:{{ t.bad }};--lg-fill:{{ t.lgFill }};--lg-fill-strong:{{ t.lgFillStrong }};--lg-edge:{{ t.lgEdge }};--lg-hi:{{ t.lgHi }};--lg-lo:{{ t.lgLo }};--lg-shadow:{{ t.lgShadow }};--dim:{{ t.dim }};position:relative;width:393px;height:852px;background:var(--base);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;font-size:17px">
<div style="position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);width:106px;height:27px;border-radius:99px;background:#030408"></div>
<div style="height:51px;flex:none"></div>
<div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:30px 16px 30px;display:flex;flex-direction:column"><span style="font-size:13px;line-height:1.4;text-transform:uppercase;letter-spacing:.02em;font-weight:500;color:var(--brand)">Rowing Pals</span><h1 style="font-size:34px;line-height:1.05;letter-spacing:0;margin:8px 0">Create your account</h1><p style="line-height:1.5;color:var(--muted);margin:0 0 22px">Your feed, leaderboards and squad live here.</p><div style="display:grid;gap:6px;margin-bottom:12px"><label for="name" style="font-size:12px;color:var(--muted);font-weight:600">Display name</label><input id="name" value="" placeholder="Piero" style="width:100%;min-height:52px;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:12px 14px;box-sizing:border-box"></div><div style="display:grid;gap:6px;margin-bottom:12px"><label for="email" style="font-size:12px;color:var(--muted);font-weight:600">Email</label><input id="email" value="" placeholder="you@example.ac.uk" style="width:100%;min-height:52px;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:12px 14px;box-sizing:border-box"></div><div style="display:grid;gap:6px;margin-bottom:12px"><label for="pw" style="font-size:12px;color:var(--muted);font-weight:600">Password</label><input id="pw" type="password" style="width:100%;min-height:52px;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:12px 14px;box-sizing:border-box"></div><label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px"><span style="width:24px;height:24px;border-radius:7px;background:var(--brand);color:var(--onBrand);display:grid;place-items:center"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="m5 12 4 4L19 6"></path></svg></span><span>I agree to the <a href="#terms">Terms of Service</a></span></label><div style="margin-top:16px"><a href="OnboardingClub.dc.html" style="width:100%;min-height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;color:var(--onBrand);background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 88%,#fff 12%),var(--brand));border:1px solid color-mix(in srgb,var(--brand) 60%,#fff 40%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18),0 8px 22px color-mix(in srgb,var(--brand) 30%,transparent);text-decoration:none;cursor:pointer">Sign up</a></div><div style="display:flex;justify-content:center;margin-top:8px"><button style="min-height:44px;border-radius:999px;padding:0 10px;background:transparent;border:0;color:var(--brand);font-size:15px;font-weight:600">Already have an account? Sign in</button></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "tsType": "string"}, "$preview": {"width": 393, "height": 852}}'>
class Component extends DCLogic {
  renderVals() {
    const DARK = {"bg": "#09090b", "base": "#101114", "card": "#1b1c21", "raised": "#292c34", "line": "#464a56", "cardEdge": "rgba(70,74,86,.7)", "text": "#f7f8fc", "muted": "#bbc0ce", "faint": "#a3abba", "brand": "#91b8ff", "brandSoft": "rgba(145,184,255,.14)", "onBrand": "#09090b", "good": "#78d7ac", "accent": "#c6adff", "accentSoft": "rgba(198,173,255,.12)", "gold": "#efc37c", "goldSoft": "rgba(239,195,124,.12)", "bad": "#ff766f", "lgFill": "rgba(58,62,74,.42)", "lgFillStrong": "rgba(92,98,114,.55)", "lgEdge": "rgba(255,255,255,.16)", "lgHi": "rgba(255,255,255,.28)", "lgLo": "rgba(0,0,0,.22)", "lgShadow": "0 8px 24px rgba(0,0,0,.22)", "dim": "rgba(0,0,0,.5)"};
    const LIGHT = {"bg": "#dfe3eb", "base": "#edf0f5", "card": "#ffffff", "raised": "#dce2ec", "line": "#949eae", "cardEdge": "#a8b1bf", "text": "#111723", "muted": "#3e4c61", "faint": "#4e5c70", "brand": "#214fa3", "brandSoft": "rgba(33,79,163,.12)", "onBrand": "#ffffff", "good": "#176a4a", "accent": "#67409b", "accentSoft": "rgba(103,64,155,.10)", "gold": "#84500b", "goldSoft": "rgba(132,80,11,.10)", "bad": "#c93c36", "lgFill": "rgba(255,255,255,.52)", "lgFillStrong": "rgba(255,255,255,.92)", "lgEdge": "rgba(40,55,85,.16)", "lgHi": "rgba(255,255,255,.95)", "lgLo": "rgba(30,45,75,.08)", "lgShadow": "0 6px 20px rgba(25,40,70,.12)", "dim": "rgba(17,23,35,.35)"};
    return { t: (this.props.theme ?? 'dark') === 'light' ? LIGHT : DARK };
  }
}
</script>
</body>
</html>
