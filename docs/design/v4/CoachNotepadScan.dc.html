<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Scan a monitor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
a{color:#91b8ff}a:hover{color:#c6adff}
</style>
</helmet>
<div data-screen-label="Coach · Scan a monitor" style="--base:{{ t.base }};--card:{{ t.card }};--raised:{{ t.raised }};--line:{{ t.line }};--cardEdge:{{ t.cardEdge }};--text:{{ t.text }};--muted:{{ t.muted }};--faint:{{ t.faint }};--brand:{{ t.brand }};--brandSoft:{{ t.brandSoft }};--onBrand:{{ t.onBrand }};--good:{{ t.good }};--lg-fill:{{ t.lgFill }};--lg-fill-strong:{{ t.lgFillStrong }};--lg-edge:{{ t.lgEdge }};--lg-hi:{{ t.lgHi }};--lg-lo:{{ t.lgLo }};--lg-shadow:{{ t.lgShadow }};--sep:{{ t.sep }};position:relative;width:393px;height:852px;overflow:hidden;display:flex;flex-direction:column;background:var(--base);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;font-size:17px">
<div style="position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);width:106px;height:27px;border-radius:99px;background:#030408"></div>
<div style="height:51px;flex:none"></div>
<header style="position:relative;min-height:58px;flex:none;padding:8px 16px 8px;display:flex;align-items:center;gap:8px">
<a href="CoachNotepadPieces.dc.html" aria-label="Close" style="width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text);background:var(--lg-fill);border:1px solid var(--lg-edge);box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 -1px 0 var(--lg-lo),var(--lg-shadow);text-decoration:none"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<h1 style="margin:0;position:absolute;left:72px;right:72px;text-align:center;font-size:17px;font-weight:600;pointer-events:none">Ollie Hart · 20 × 250m</h1>
</header>
<div style="flex:none;padding:0 16px 10px;display:flex;align-items:center;gap:6px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="3"><span style="min-height:28px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ c.color }};background:{{ c.bg }}">{{ c.label }}</span></sc-for>
<span style="flex:1"></span>
<span style="font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:{{ countColor }}">{{ countLabel }}</span>
</div>
<sc-if value="{{ capturing }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px">
<div style="position:relative;flex:1;border-radius:28px;overflow:hidden;background:repeating-linear-gradient(135deg,#1f2128 0 14px,#25272f 14px 28px);display:grid;place-items:center">
<div style="position:absolute;inset:18% 12%;border-radius:18px;border:2px solid rgba(255,255,255,.75)"></div>
<span style="font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#c5cad6;letter-spacing:.06em">{{ finderLabel }}</span>
</div>
<p style="margin:0;font-size:13px;line-height:1.4;color:var(--muted);text-align:center">{{ finderHelp }}</p>
<div style="display:flex;align-items:center;justify-content:center;gap:28px">
<sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}"><button onClick="{{ backToList }}" style="min-height:44px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--brand);background:transparent;border:none">Back to list</button></sc-if>
<button onClick="{{ shoot }}" aria-label="Take photo" style="width:74px;height:74px;border-radius:50%;background:transparent;border:4px solid var(--text);display:grid;place-items:center;padding:0"><span style="width:58px;height:58px;border-radius:50%;background:var(--text)"></span></button>
</div>
</div>
</sc-if>
<sc-if value="{{ reviewing }}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 16px 16px">
<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;border-radius:20px;background:var(--brandSoft);font-size:13px;line-height:1.35;color:var(--text)">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;flex:none;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><path d="M4 4l16 16"></path></svg>
<span>{{ banner }}</span>
</div>
<div style="background:var(--card);border:1px solid var(--cardEdge);border-radius:24px;overflow:hidden">
<div style="display:grid;grid-template-columns:30px minmax(0,1fr) 70px 70px 40px;gap:4px;padding:8px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)"><span>#</span><span>Time</span><span style="text-align:right">Split</span><span style="text-align:right">Metres</span><span style="text-align:right">Rate</span></div>
<sc-for list="{{ pieces }}" as="p" hint-placeholder-count="8">
<div style="display:grid;grid-template-columns:30px minmax(0,1fr) 70px 70px 40px;gap:4px;align-items:center;min-height:40px;padding:2px 12px;border-top:1px solid var(--sep);background:{{ p.bg }};font-variant-numeric:tabular-nums;font-size:15px">
<span style="font-size:13px;color:var(--faint)">{{ p.n }}</span><span>{{ p.time }}</span><span style="text-align:right;font-weight:600">{{ p.split }}</span><span style="text-align:right;color:var(--muted)">250</span><span style="text-align:right;color:var(--muted)">{{ p.rate }}</span>
</div>
</sc-for>
</div>
<p style="margin:10px 4px 0;font-size:13px;line-height:1.4;color:var(--muted)">{{ foot }}</p>
</div>
<div style="flex:none;padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px">
<sc-if value="{{ more }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ again }}" style="min-height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;background:var(--lg-fill);border:1px solid var(--lg-edge);box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 -1px 0 var(--lg-lo)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.2"></circle></svg>Scan the next screen</button>
</sc-if>
<a href="CoachNotepadPieces.dc.html" style="min-height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--onBrand);background:var(--brand);border:1px solid var(--brand);text-decoration:none">{{ fillLabel }}</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const DARK = {base:"#101114",card:"#1b1c21",raised:"#292c34",line:"#464a56",cardEdge:"rgba(70,74,86,.7)",text:"#f7f8fc",muted:"#bbc0ce",faint:"#a3abba",brand:"#91b8ff",brandSoft:"rgba(145,184,255,.14)",onBrand:"#09090b",good:"#78d7ac",lgFill:"rgba(58,62,74,.42)",lgFillStrong:"rgba(92,98,114,.55)",lgEdge:"rgba(255,255,255,.16)",lgHi:"rgba(255,255,255,.28)",lgLo:"rgba(0,0,0,.22)",lgShadow:"0 8px 24px rgba(0,0,0,.22)",sep:"rgba(255,255,255,.12)"};
    const LIGHT = {base:"#edf0f5",card:"#ffffff",raised:"#dce2ec",line:"#949eae",cardEdge:"#a8b1bf",text:"#111723",muted:"#3e4c61",faint:"#4e5c70",brand:"#214fa3",brandSoft:"rgba(33,79,163,.12)",onBrand:"#ffffff",good:"#176a4a",lgFill:"rgba(255,255,255,.52)",lgFillStrong:"rgba(255,255,255,.92)",lgEdge:"rgba(40,55,85,.16)",lgHi:"rgba(255,255,255,.95)",lgLo:"rgba(30,45,75,.08)",lgShadow:"0 6px 20px rgba(25,40,70,.12)",sep:"rgba(60,60,67,.18)"};
    const t = (this.props.theme ?? 'dark') === 'light' ? LIGHT : DARK;
    const SCREENS = [[1, 8], [7, 14], [13, 20]];
    const shots = this.state.shots ?? 0;
    const capturing = this.state.capturing ?? true;
    const pad2 = (n) => String(n).padStart(2, '0');
    const f = (ds) => Math.floor(ds / 600) + ':' + pad2(Math.floor((ds % 600) / 10)) + '.' + (ds % 10);
    const splitDs = (n) => 885 + ((n * 7) % 9) + Math.floor(n / 4) * 3;
    const read = shots === 0 ? 0 : SCREENS[shots - 1][1];
    const newFrom = shots === 0 ? 0 : (shots === 1 ? 1 : SCREENS[shots - 2][1] + 1);
    const pieces = Array.from({ length: read }, (_, i) => {
      const n = i + 1; const sd = splitDs(n);
      return { n, split: f(sd), time: f(Math.round(sd / 2)), rate: String(33 + (n % 3)), bg: n >= newFrom ? t.brandSoft : 'transparent' };
    });
    const done = read >= 20;
    const chips = SCREENS.map((sc, i) => ({ label: 'Screen ' + (i + 1), color: i < shots ? t.text : (i === shots && capturing ? t.brand : t.faint), bg: i < shots ? t.raised : (i === shots && capturing ? t.brandSoft : 'transparent') }));
    const overlap = shots >= 2 ? 'Pieces ' + SCREENS[shots - 1][0] + '–' + SCREENS[shots - 2][1] + ' were on both screens, so they’re kept once. ' : '';
    return {
      t, chips, pieces,
      capturing, reviewing: !capturing,
      canBack: shots > 0,
      countLabel: read + ' of 20 read', countColor: done ? t.good : t.muted,
      finderLabel: shots === 0 ? 'MONITOR · RESULTS SCREEN' : 'MONITOR · NEXT PAGE OF RESULTS',
      finderHelp: shots === 0 ? 'Fit the monitor’s results inside the frame. Only the numbers are kept: the photo is deleted once it’s read.' : 'Scroll the monitor down to the next pieces, then take another photo. Overlap is fine.',
      banner: 'Read from screen ' + shots + '. The photo has been deleted, only these numbers are kept.',
      foot: overlap + (done ? 'All 20 pieces are in. Tap a number on the page to fix it.' : 'Highlighted rows are new. ' + (20 - read) + ' pieces still to read.'),
      more: !done,
      fillLabel: done ? 'Fill Ollie’s row' : 'Fill Ollie’s row with ' + read + ' pieces',
      shoot: () => this.setState({ shots: Math.min(3, shots + 1), capturing: false }),
      again: () => this.setState({ capturing: true }),
      backToList: () => this.setState({ capturing: false })
    };
  }
}
</script>
</body>
</html>
