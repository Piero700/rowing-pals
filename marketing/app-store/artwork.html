<!doctype html>
<!--
  Rowing Pals — App Store screenshots and banners.
  Open with no query to see the gallery. Each piece renders alone at its exact size with
  ?id=<id> (see ART below); render.sh exports them all to export/ as PNG.
  Solid colours only (decision 100): flat ground, one accent per piece, no gradients or blurred glows.
  Apple allows 10 screenshots per device, so ART holds exactly 10. Every phone sits fully inside its canvas.
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Rowing Pals — App Store artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../website/assets/ui.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--base); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .art { position: relative; overflow: hidden; background: var(--base); --c: var(--brand); }
    .art h1 { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; font-weight: 700; letter-spacing: -.045em; }
    .hl { color: var(--c); }
    .eyebrow { display: inline-flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
    .eyebrow::before, .eyebrow::after { content: ""; width: 44px; height: 4px; border-radius: 2px; background: currentColor; }
    .brand-row { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 50px; }
    .brand-row img { width: 96px; height: 96px; border-radius: 24px; }

    /* ---------- screenshot 1290 × 2796: the phone is 2110 tall, 86 clear of the foot ---------- */
    .shot { width: 1290px; height: 2796px; }
    .shot .cap { position: absolute; top: 124px; left: 60px; right: 60px; text-align: center; }
    .shot h1 { margin: 34px 0 0; font-size: 136px; line-height: 1; }
    .shot .dev { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); }
    .shot .dev .phone { zoom: 2.5; }

    /* ---------- feature banner 1920 × 1080 ---------- */
    .feature { width: 1920px; height: 1080px; }
    .feature .copy { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); width: 800px; }
    .feature h1 { margin: 0 0 30px; font-size: 128px; line-height: .96; }
    .feature .copy p { margin: 0; font-size: 34px; line-height: 1.4; color: var(--ink2); max-width: 740px; }
    .feature .devs { position: absolute; right: 100px; top: 88px; display: flex; gap: 40px; }
    .feature .devs .phone:first-child { margin-top: 60px; }

    /* ---------- social / OG 1200 × 630 ---------- */
    .og { width: 1200px; height: 630px; }
    .og .copy { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); width: 720px; }
    .og .brand-row { font-size: 32px; margin-bottom: 34px; gap: 16px; }
    .og .brand-row img { width: 68px; height: 68px; border-radius: 17px; }
    .og h1 { margin: 0 0 22px; font-size: 92px; line-height: .96; }
    .og .copy p { margin: 0; font-size: 28px; font-weight: 500; color: var(--ink2); }
    .og .dev { position: absolute; right: 110px; top: 30px; zoom: .675; }

    /* ---------- coach promo 1024 × 1024 ---------- */
    .promo { width: 1024px; height: 1024px; }
    .promo .copy { position: absolute; left: 0; right: 0; top: 84px; text-align: center; }
    .promo h1 { margin: 22px 0 0; font-size: 112px; line-height: .98; }
    .promo .boat { position: absolute; left: 0; right: 0; top: 370px; height: 400px; display: flex; align-items: center; justify-content: center; }
    .promo .boat .hull { width: 582px; zoom: 1.55; }
    .promo .foot { position: absolute; left: 40px; right: 40px; bottom: 84px; text-align: center; font-size: 32px; font-weight: 500; line-height: 1.45; color: var(--ink2); }
    .promo .foot b { color: var(--ink); font-weight: 600; }

    /* ---------- gallery ---------- */
    .gallery { padding: 40px; display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; }
    .gallery h2 { width: 100%; margin: 20px 0 0; font-size: 22px; font-weight: 700; color: var(--ink2); }
    .tile { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink3); }
    .tile .frame { overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="../website/assets/ui.js"></script>
<script>
  RPUI.base = '../website/assets/';
  const ICON = '../website/assets/icon-256.png';
  const phone = (screen) => `<div class="phone">${RPUI.render(screen)}</div>`;

  const shot = (o) => ({
    w: 1290, h: 2796, html: () => `<div class="art shot" style="--c:${o.c || 'var(--brand)'}">
      <div class="cap"><span class="eyebrow">${o.eyebrow}</span><h1>${o.title}</h1></div>
      <div class="dev">${phone(o.screen)}</div></div>`
  });

  const ART = {
    // Rower screenshots
    '01-proven': shot({ eyebrow: 'Snap · Post · Rank', title: 'Every metre.<br><span class="hl">Proven.</span>', screen: 'feed' }),
    '02-capture': shot({ eyebrow: 'Dual camera', title: 'Two cameras.<br><span class="hl">One shot.</span>', screen: 'capture' }),
    '03-numbers': shot({ eyebrow: 'Read for you', title: 'We read<br><span class="hl">the numbers.</span>', screen: 'review' }),
    '04-rankings': shot({ eyebrow: 'Leaderboards', c: 'var(--rank)', title: 'Climb the<br><span class="hl">rankings.</span>', screen: 'rankings' }),
    '05-challenges': shot({ eyebrow: 'Challenges and erg events', title: 'Turn the winter<br>into a <span class="hl">contest.</span>', screen: 'challenges' }),
    '06-pbs': shot({ eyebrow: 'Personal bests', c: 'var(--records)', title: 'PBs worth<br><span class="hl">celebrating.</span>', screen: 'pb' }),
    '07-your-boat': shot({ eyebrow: 'From your coach', title: 'Your boat.<br><span class="hl">Your seat.</span>', screen: 'yourBoat' }),
    // Coach screenshots
    '08-coach-rowers': shot({ eyebrow: 'For coaches · Rowers', title: 'Know every<br><span class="hl">rower.</span>', screen: 'coachRowers' }),
    '09-coach-notepad': shot({ eyebrow: 'For coaches · Notepad', title: 'Write down<br><span class="hl">the scores.</span>', screen: 'coachNotepad' }),
    '10-coach-boats': shot({ eyebrow: 'For coaches · Boats', title: 'Crew boats<br><span class="hl">in seconds.</span>', screen: 'coachBoat' }),

    // Banners
    'banner-feature-1920x1080': { w: 1920, h: 1080, html: () => `<div class="art feature">
      <div class="copy"><div class="brand-row"><img src="${ICON}" alt="">Rowing Pals</div>
        <h1>Every metre.<br><span class="hl">Proven.</span></h1>
        <p>Snap the erg monitor and yourself in one shot. We read the numbers and put you on the leaderboard.</p></div>
      <div class="devs">${phone('capture')}${phone('feed')}</div></div>` },
    'banner-social-1200x630': { w: 1200, h: 630, html: () => `<div class="art og">
      <div class="copy"><div class="brand-row"><img src="${ICON}" alt="">Rowing Pals</div>
        <h1>Every metre.<br><span class="hl">Proven.</span></h1>
        <p>The social training app for rowers.</p></div>
      <div class="dev">${phone('feed')}</div></div>` },
    'banner-coach-promo-1024': { w: 1024, h: 1024, html: () => `<div class="art promo">
      <div class="copy"><span class="eyebrow">Rowing Pals</span><h1>Coach<br><span class="hl">the squad.</span></h1></div>
      <div class="boat"><div class="hull">${RPUI.boat(RPUI.crew, { type: '8+', colour: '#2C5F8A', deck: '#20405C' })}</div></div>
      <div class="foot"><b>Rowers · Workouts · Notepad · Boats · Calendar</b><br>The coach’s own version of the app.</div></div>` }
  };

  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('root');
  if (id && ART[id]) {
    root.innerHTML = ART[id].html();
  } else {
    const groups = [['Screenshots · 1290 × 2796 (6.9" iPhone)', k => !k.startsWith('banner')], ['Banners', k => k.startsWith('banner')]];
    root.innerHTML = '<div class="gallery">' + groups.map(([title, f]) => `<h2>${title}</h2>` + Object.keys(ART).filter(f).map(k => {
      const a = ART[k], s = k.startsWith('banner') ? 520 / a.w : 300 / a.w;
      return `<div class="tile"><div class="frame" style="width:${a.w * s}px;height:${a.h * s}px"><div style="zoom:${s}">${a.html()}</div></div><a href="?id=${k}" style="color:inherit">${k}</a></div>`;
    }).join('')).join('') + '</div>';
  }
</script>
</body>
</html>
